<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Infotac</title>
</head>
<body>
  <main id="app"></main>
  <script>
    const form = document.querySelector('#change-password-form');
    if (form) {
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const passwordInput = form.querySelector('input[name="password"], input[type="password"]');
        const nuevaPassword = passwordInput ? passwordInput.value.trim() : '';
        if (nuevaPassword.length < 6) {
          throw new Error('La contraseña debe tener al menos 6 caracteres');
        }
        const response = await fetch('/api/set-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ password: nuevaPassword })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'No se pudo cambiar la contraseña');
      });
    }
  </script>
</body>
</html>

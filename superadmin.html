<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Infotac SuperAdmin</title><style>body{font:16px system-ui;max-width:48rem;margin:3rem auto;padding:1rem}label{display:block;margin:1rem 0}input{display:block;padding:.6rem;width:100%;box-sizing:border-box}button{padding:.7rem}table{border-collapse:collapse;width:100%}th,td{padding:.6rem;border-bottom:1px solid #ddd;text-align:left}</style></head><body><h1>Licencias · Infotac</h1><form id="login"><label>Email<input type="email" name="email" required autocomplete="username"></label><label>Contraseña<input type="password" name="password" required autocomplete="current-password"></label><button>Entrar</button></form><section id="panel" hidden><p id="who"></p><button id="logout" type="button">Salir</button><table><thead><tr><th>Empresa</th><th>Estado</th><th>Vence</th><th>Gracia hasta</th></tr></thead><tbody id="rows"></tbody></table></section><p id="error" role="alert"></p><script>const form=document.getElementById('login'),panel=document.getElementById('panel'),err=document.getElementById('error');const date=x=>x?new Date(x).toLocaleDateString('es-UY'):'—';async function load(){const s=await fetch('/api/admin-session',{cache:'no-store'});if(!s.ok)return;const c=await fetch('/api/admin-companies',{cache:'no-store'});if(!c.ok)throw Error('No se pudieron cargar licencias.');const user=await s.json(),list=await c.json();document.getElementById('who').textContent=user.admin.email||'SuperAdmin';const rows=document.getElementById('rows');rows.replaceChildren();for(const company of list.companies){const tr=document.createElement('tr');for(const value of [company.nombre,company.license?.status||'Sin licencia',date(company.license?.ends_at),date(company.license?.grace_ends_at)]){const td=document.createElement('td');td.textContent=value;tr.appendChild(td)}rows.appendChild(tr)}form.hidden=true;panel.hidden=false}form.addEventListener('submit',async e=>{e.preventDefault();err.textContent='';const button=form.querySelector('button');button.disabled=true;try{const r=await fetch('/api/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});if(!r.ok)throw Error('Acceso denegado.');form.reset();await load()}catch(x){err.textContent=x.message}finally{button.disabled=false}});document.getElementById('logout').onclick=async()=>{await fetch('/api/admin-logout',{method:'POST'});panel.hidden=true;form.hidden=false;document.getElementById('rows').replaceChildren()};load().catch(x=>err.textContent=x.message);</script></body></html>
